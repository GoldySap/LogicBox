[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logicbox-engine"
version = "1.1.0"
description = "Target-agnostic node, signal, and rendering architecture."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []  # Zero core dependencies!
keywords = ["engine", "games", "applications", "rendering", "node-tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
terminal = []       # Standard library only
pygame = ["pygame>=2.5.0"]
opengl = ["moderngl>=5.8.0", "PyGLM>=2.7.0"]
all = ["pygame>=2.5.0", "moderngl>=5.8.0", "PyGLM>=2.7.0"]
network = []        # Python standard-library networking
dev = [
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
logicbox = "engine.cli:main"

[tool.setuptools.package-data]
"engine" = ["py.typed"]